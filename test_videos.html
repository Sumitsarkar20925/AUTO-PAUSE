<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auto-Pause Test</title>
  <style>body{font-family:Arial;padding:20px}video{max-width:100%;margin-bottom:16px}</style>
</head>
<body>
  <h1>Auto-Pause Test Page</h1>
  <p>Two autoplaying muted videos. Switch tabs or blur the window to test pausing.</p>

  <video id="v1" controls autoplay muted playsinline>
    <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <video id="v2" controls autoplay muted playsinline>
    <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm">
    Your browser does not support the video tag.
  </video>

  <p>If videos don't autoplay, click play on each then switch tabs.</p>
</body>
</html>
